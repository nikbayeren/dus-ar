<!doctype html>
<html lang="tr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Duşakabin AR</title>

    <script type="module" src="https://unpkg.com/@google/model-viewer@1.14.0/dist/model-viewer.min.js">
    </script>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h1>Duşakabin AR Demo</h1>

    <model-viewer id="mv" src="" ios-src="" alt="Duşakabin" ar ar-modes="scene-viewer quick-look webxr" camera-controls
        ar-scale="fixed" exposure="1" style="width:100%;height:500px;background:#f2f2f2;">
    </model-viewer>

    <div class="controls">
        <button id="arBtn">📱 Banyonuzda Dene (AR)</button>
    </div>

    <script src="app.js"></script>

</body>

</html>
